folder: module6/streams_assignment

build:
  - []                # ./build.sh (no arguments)

run:
  - [16, 16, 32]      # base configuration (16x16 blocks, 32 photos)
  - [8, 8, 32]        # additional block size #1 (64 threads)
  - [32, 32, 32]      # additional block size #2 (1024 threads)
  - [32, 8, 32]       # additional block shape #1 (wide)
  - [128, 1, 32]      # additional block shape #2 (one row)
  - [16, 16, 8]       # additional batch size #1 (8 photos)
  - [16, 16, 64]      # additional batch size #2 (64 photos)
